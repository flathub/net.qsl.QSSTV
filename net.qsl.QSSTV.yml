app-id: net.qsl.QSSTV
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
command: qsstv
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=all
  - --socket=pulseaudio
  - --share=network
  - --persist=qsstv
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - shared-modules/linux-audio/fftw3f.json

  - name: hamlib
    sources:
      - type: archive
        url: https://github.com/Hamlib/Hamlib/releases/download/4.7.2/hamlib-4.7.2.tar.gz
        sha256: ae1fcf2dbc80ea0786ea8f047b09399c3f7737d1930442f61a031708ed33e88f
        x-checker-data:
          type: anitya
          project-id: 1292
          url-template: https://github.com/Hamlib/Hamlib/releases/download/$version/hamlib-$version.tar.gz

  - name: qsstv
    buildsystem: qmake
    config-opts:
      - QMAKE_LIBDIR=/app/lib
    post-install:
      - install -Dm644 qsstv.desktop $FLATPAK_DEST/share/applications/net.qsl.QSSTV.desktop
      - desktop-file-edit --set-icon=net.qsl.QSSTV $FLATPAK_DEST/share/applications/net.qsl.QSSTV.desktop
      - install -Dm644 net.qsl.QSSTV.png -t $FLATPAK_DEST/share/icons/hicolor/128x128/apps/
      - install -Dm644 net.qsl.QSSTV.metainfo.xml -t $FLATPAK_DEST/share/metainfo/
    sources:
      - type: archive
        url: https://www.qsl.net/o/on4qz/qsstv/downloads/qsstv_9.5.8.tar.gz
        sha256: c03f7fa5c680ced8fd331c25ff3e47440c9aedb48ec7b66255c6aa0ed88e7a68
        x-checker-data:
          type: anitya
          project-id: 4133
          url-template: https://www.qsl.net/o/on4qz/qsstv/downloads/qsstv_$version.tar.gz
      - type: file
        path: net.qsl.QSSTV.png
      - type: file
        path: net.qsl.QSSTV.metainfo.xml

